<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Marcord</title><link rel="stylesheet" href="style.css"><link rel="icon" type="image/x-icon" href="./favicon.ico"></head><body><h1><strong>Marcord</strong></h1><audio src="music.mp3" autoplay controls loop></audio><div id="loginDiv"><h2><strong>Join Server</strong> (server limit is <strong>20 CCU</strong>)</h2><h3><strong>If there is any problem, check the debug logs!</strong></h3><input id="username" placeholder="Enter your name..." /><select id="regionSelect"><option value="us">US</option><option value="eu">EU</option><option value="asia">Asia</option><option value="jp">Japan</option><option value="au">Australia</option></select><button onclick="start()"><strong>Join Marcord</strong></button><button onclick="startServer()"><strong>Start Marcord Server</strong></button></div><div id="chatContainer" style="display:none"><div id="chat"></div><div id="userList"><strong>Users in Server:</strong><ul id="usersUl"></ul></div><input id="msg" placeholder="Type message..." /><button id="sendBtn"><strong>Send</strong></button><input id="imgInput" type="file" accept="image/*" /><button id="sendImgBtn"><strong>Send Image</strong></button><div id="heartbeatStatus">🔴 Disconnected</div></div><div id="debugLog"><strong>Debug Log:</strong></div><button onclick="dumpTelemetry()"><strong>Dump DBGLGS</strong></button><script src="server.js"></script><script src="script.js"></script></body></html>
