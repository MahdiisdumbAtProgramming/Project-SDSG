<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>UNFAIRDYNE</title><link href="favicon.ico" rel="icon" /><base href="https://fairdyne-mahdiisdumb.up.railway.app/"><style> html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; } iframe { border: none; width: 100vw; height: 100vh; display: block; } </style></head><body><iframe id="game-frame" src="index.html" tabindex="0"></iframe><script> const iframe = document.getElementById('game-frame'); iframe.addEventListener('load', () => { iframe.contentWindow.focus(); }); ['keydown', 'keyup', 'keypress'].forEach(eventType => { window.addEventListener(eventType, e => { iframe.contentWindow.dispatchEvent(new KeyboardEvent(e.type, e)); }); }); ['mousedown', 'mouseup', 'mousemove', 'click'].forEach(eventType => { window.addEventListener(eventType, e => { iframe.contentWindow.dispatchEvent(new MouseEvent(e.type, e)); }); }); </script></body></html>
